  merge_intro:
    - stage: Board_git_merge
    - Unit1.hide: {}
    - Unit2.hide: {}
    - Unit3.hide: {}
    - Unit4.hide: {}
    - Unit5.hide: {}
    - Unit6.hide: {}
    - AnswerA.hide: {}
