  snapshot_intro:
    - stage: Board_git_snapshot
    - Unit1.hide: {}
    - Unit2.hide: {}
    - Unit3.hide: {}
    - Unit4.hide: {}
    - Unit5.hide: {}
    - Unit6.hide: {}
    - AnswerA.hide: {}
    - AnswerB.hide: {}
    - NextUnit.hide: {}
    - Menu.hide: {}
    - Pura.show:
        skin: PuraIdle
        x: -135
        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: また「最終版の最終版3.sb3」が増えた！ 最終版の大家族だよ。
        seconds: 6.6
        styles:
          - lesson
    - Pura.say:
        text: Gitは変更の履歴を扱う道具。いつ、どんな意図で変えたかを、コミットとして残せるんだ。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: 保存したら、世界中に作品が公開されるの？
        seconds: 4.6
        styles:
          - lesson
    - Pura.say:
        text: 保存、コミット、共有は別の操作だよ。ローカルにコミットしても、それだけで外へは送られない。
        seconds: 8.7
        styles:
          - lesson
    - Moko.say:
        text: セーブは作業中の状態。コミットは、説明を添えて残す区切りだね。
        seconds: 6.4
        styles:
          - lesson
    - Pura.say:
        text: そう。Gitの履歴は、記録した内容を取り出したり、変更の理由を調べたりする手がかりになる。
        seconds: 8.7
        styles:
          - lesson
    - Moko.say:
        text: Gitがあれば、バックアップは全部いらない？
        seconds: 4.9
        styles:
          - lesson
    - Pura.say:
        text: 未記録の変更や、追跡していないファイルまで守るわけじゃないよ。別の保存先も必要に応じて用意しよう。
        seconds: 9.3
        styles:
          - lesson
    - Moko.say:
        text: SB3はひとまとめのファイル。中身の差分を、行として読めるとは限らないね。
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: Plusのフォルダー形式なら、ソースや素材を分けて扱える。形式と対応環境を確認し、まず複製した練習作品で試そう。
        seconds: 10.4
        styles:
          - lesson
    - Moko.say:
        text: この講座は説明とクイズで進むよ。ぼくたちが勝手にcommitやpushをすることはないんだ。
        seconds: 8.8
        styles:
          - lesson
    - goto: snapshot_quiz
