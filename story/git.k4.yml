        scale: 9.5
    - Moko.say:
        text: 新しい演出を試したい。でも、元の作品も見失いたくない！
        seconds: 5.8
        styles:
          - lesson
    - Pura.say:
        text: ブランチで作業の流れを分けられる。共通の履歴から別の変更を重ね、あとで統合を考えよう。
        seconds: 8.3
        styles:
          - lesson
    - Moko.say:
        text: 枝を作ると、全ファイルが別の箱に丸ごとコピーされるの？
        seconds: 5.8
        styles:
          - lesson
    - Pura.say:
        text: Gitのブランチは、あるコミットを指す名前として考えるとよいよ。新しいコミットで、その指す先が進む。
        seconds: 9.5
        styles:
          - lesson
    - Moko.say:
        text: 名前は「星の改良」みたいに目的を示すと分かりやすいね。
        seconds: 5.8
        styles:
          - lesson
    - Pura.say:
        text: 実際の命名規則はチームに合わせよう。作業を始める前に、今いるブランチを確認する習慣も大切だ。
        seconds: 8.8
        styles:
          - lesson
    - Moko.say:
        text: 未コミットの変更があるけど、とにかく切り替えれば大丈夫？
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: 切り替えが止められる場合も、変更が持ち越される場合もある。先に状態を確認し、保存や記録の方針を決めよう。
        seconds: 9.8
        styles:
          - lesson
    - Moko.say:
        text: 履歴と作業中のファイルは、いつも同じ話ではないんだね。
        seconds: 5.8
        styles:
          - lesson
    - Pura.say:
        text: うん。どの枝で、どの変更を作っているかを意識すると、後から追いやすくなるよ。
        seconds: 7.5
        styles:
          - lesson
