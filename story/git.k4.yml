  diff_intro:
    - stage: Board_git_diff
    - Unit1.hide: {}
    - Unit2.hide: {}
    - Unit3.hide: {}
    - Unit4.hide: {}
    - Unit5.hide: {}
    - Unit6.hide: {}
    - AnswerA.hide: {}
    - AnswerB.hide: {}
    - NextUnit.hide: {}
    - Menu.hide: {}
    - Pura.show:
        skin: PuraIdle
        x: -135
        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: コミットの前に、目を閉じて「きっとうまくいった」と念じます！
        seconds: 6.2
        styles:
          - lesson
    - Pura.say:
        text: 目を開けて。まず何が変わったかを見よう。状態と差分は、作業を理解する入口だよ。
        seconds: 7.7
        styles:
          - lesson
    - Moko.say:
        text: 上の図は、60を70に変えた例。マイナス行が前、プラス行が後だね。
        seconds: 6.7
        styles:
          - lesson
    - Pura.say:
        text: そう。これは説明用の図で、今のGitの状態を読み取った表示ではないよ。実際の差分はGit画面で確認しよう。
        seconds: 9.9
        styles:
          - lesson
    - Moko.say:
        text: 間隔だけを変えたつもりなのに、音の素材も変わっていたら？
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: 意図した変更か調べよう。関連のない変更は混ぜず、必要な作業を別の区切りにすると説明しやすい。
        seconds: 8.8
        styles:
          - lesson
    - Moko.say:
        text: 自動で生成されるファイルが大量にあると、読みたい変更が埋もれそう。
        seconds: 6.7
        styles:
          - lesson
    - Pura.say:
        text: 何を追跡するかはプロジェクトの方針に合わせよう。素材や生成物を、全部同じ扱いにはしないんだ。
        seconds: 8.8
        styles:
          - lesson
    - Moko.say:
        text: じゃあ実際のコードで、数値を一つ変えるところから試そう。
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: 「関数れんしゅう」の個数か間隔を変えてみて。ガイドは変更の発生までを待つ。Gitへの記録はまだ行わないよ。
        seconds: 9.9
        styles:
          - lesson
    - broadcastMessageAndWait: lesson:git_diff
    - goto: diff_quiz
