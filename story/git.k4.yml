    - Pura.show:
        skin: PuraIdle
        x: -135
        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: Gitにもステージ？ スプライトが漫才をする場所？
        seconds: 5.4
        styles:
          - lesson
    - Pura.say:
        text: 同じ言葉でも別物！ Gitのステージは、次のコミットへ入れる内容を準備する場所だよ。
        seconds: 8.2
        styles:
          - lesson
    - Moko.say:
        text: ファイルを編集しただけでは、まだコミットに入れる準備ができたとは限らないんだね。
        seconds: 7.9
        styles:
          - lesson
    - Pura.say:
        text: 対象の変更を選び、ステージした内容を確認し、意味のある区切りでコミットする。
        seconds: 7.5
        styles:
          - lesson
    - Moko.say:
        text: ステージした後、さらに数値を変えた。その変更も勝手に入る？
        seconds: 6.1
        styles:
          - lesson
    - Pura.say:
        text: 通常は、後の編集は別の未ステージ変更になる。コミット直前には、ステージ側の差分を見よう。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: メッセージは「変更しました」で毎回よい？
        seconds: 4.6
        styles:
          - lesson
    - Pura.say:
        text: 何を、なぜ変えたかが分かると役に立つ。「星が重ならないよう間隔を広げる」なら意図が伝わるね。
        seconds: 8.8
        styles:
          - lesson
    - Moko.say:
        text: 一行につき一コミットにすれば、最高に小さい！
        seconds: 4.9
        styles:
          - lesson
    - Pura.say:
        text: 行数競争じゃないよ。一つの目的として理解し、確認できる単位を考えよう。必要な関連変更は一緒に含める。
        seconds: 9.5
        styles:
          - lesson
    - Moko.say:
        text: 記録できたら履歴を見て、入れたつもりの変更が入ったか確かめよう！
        seconds: 6.6
        styles:
          - lesson
