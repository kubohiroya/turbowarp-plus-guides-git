        y: -110
        scale: 9.5
    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: 別の枝を合わせよう。Gitがあるから、作品の意味も全部理解してくれるよね？
        seconds: 7.4
        styles:
          - lesson
    - Pura.say:
        text: 文字として合わせられても、意図や動作まで保証しないよ。統合後には差分と動作を確認しよう。
        seconds: 8.5
        styles:
          - lesson
    - Moko.say:
        text: 同じ場所を違う内容に変えると、競合になることがあるんだね。
        seconds: 6.1
        styles:
          - lesson
    - Pura.say:
        text: 両方の目的を読み、最終的にどんな状態にするか決める。片方を機械的に選べば正解とは限らない。
        seconds: 8.7
        styles:
          - lesson
    - Moko.say:
        text: 競合の印を消しただけで、仕事が終わった気になりそう！
        seconds: 5.6
        styles:
          - lesson
    - Pura.say:
        text: 必要な内容が残っているか確かめ、関連する処理も試そう。解消と動作確認はセットだよ。
        seconds: 8
        styles:
          - lesson
    - Moko.say:
        text: 公開したコミットに間違いを見つけたら、過去を消せばよい？
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: 共有済みの履歴を勝手に書き換えると、他の人に影響する。打ち消す変更を新たに記録するrevertも選択肢になる。
        seconds: 10.3
        styles:
          - lesson
    - Moko.say:
        text: 履歴を消すのと、変更を打ち消して履歴を残すのは、違う操作だね。
        seconds: 6.4
        styles:
          - lesson
    - Pura.say:
        text: 修正方法は状況とチームの方針に合わせよう。分からない状態で破壊的な操作を連打せず、差分を確かめるんだ。
        seconds: 9.6
        styles:
          - lesson
