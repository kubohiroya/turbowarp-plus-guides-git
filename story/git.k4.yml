    - Moko.show:
        skin: MokoIdle
        x: 135
        y: -110
        scale: 9.5
    - Moko.say:
        text: リモートって、遠くからエアコンを操作するやつ？
        seconds: 5.1
        styles:
          - lesson
    - Pura.say:
        text: それはリモコン。Gitでは共有先のリポジトリ。GitHubはその置き場所を提供するサービスの一つだよ。
        seconds: 9.6
        styles:
          - lesson
    - Moko.say:
        text: fetchで履歴を取り寄せて、相手の変更を調べる。pullは統合も行うんだね。
        seconds: 7.7
        styles:
          - lesson
    - Pura.say:
        text: そう。pullでどう統合するかは設定や指定による。実行前に現在の枝と作業状態を確認しよう。
        seconds: 8.7
        styles:
          - lesson
    - Moko.say:
        text: pushすれば、自分のコミットが共有先へ送られる。コミット前のファイル全部が送られるわけじゃないね。
        seconds: 9.5
        styles:
          - lesson
    - Pura.say:
        text: 送信先と枝を確かめよう。共有前に差分を読み、必要な動作確認を行い、チームならレビューを依頼する。
        seconds: 9.1
        styles:
          - lesson
    - Moko.say:
        text: パスワードも作品の素材と一緒に記録しておけば、便利そう！
        seconds: 5.9
        styles:
          - lesson
    - Pura.say:
        text: それは記録しない。秘密情報を履歴へ入れると、後でファイルを消しただけでは過去の記録に残る場合がある。
        seconds: 9.5
        styles:
          - lesson
    - Moko.say:
        text: .gitignoreに書けば、すでに追跡中の秘密まで自動で消える？
        seconds: 6.7
        styles:
          - lesson
    - Pura.say:
        text: 消えないよ。ignoreは主に未追跡ファイルを扱う設定。漏えいした秘密は失効・再発行など、別の対応も必要になる。
        seconds: 10.4
        styles:
          - lesson
    - Moko.say:
        text: まず手元で、小さく記録して、変更を読めるようにする。Gitは制作の相談相手になりそう！
        seconds: 8.3
        styles:
          - lesson
